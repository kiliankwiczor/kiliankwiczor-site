<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#F7F5F1"/><circle cx="900" cy="460" r="360" fill="#E9E1F1"/><text x="90" y="180" font-family="sans-serif" font-size="58" fill="#282334" font-weight="700">mova ◒</text><text x="90" y="820" font-family="sans-serif" font-size="100" fill="#573B68" font-weight="700"><tspan x="90">Une étape</tspan><tspan x="90" dy="120">de plus</tspan><tspan x="90" dy="120">pour toi.</tspan></text><rect x="90" y="1260" width="900" height="280" rx="48" fill="#573B68"/><text x="140" y="1380" font-family="sans-serif" font-size="46" fill="#FFFFFF">Modèle de carte de réussite</text><text x="140" y="1460" font-family="sans-serif" font-size="32" fill="#E9E1F1">Aucune performance personnelle préremplie</text><text x="90" y="1760" font-family="sans-serif" font-size="36" fill="#573B68">Ta progression. Ta communauté. Ton rythme.</text></svg>
